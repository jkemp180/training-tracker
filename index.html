<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hybrid">
  <meta name="description" content="A mobile-first hybrid strength and running tracker.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="preview-styles.css">
  <title>Hybrid Training Tracker</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="todayLabel">TODAY</p>
        <h1 id="pageTitle">Training</h1>
      </div>
      <button class="icon-button" id="themeToggle" aria-label="Toggle theme">◐</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-view="today" class="nav-item active"><span>●</span><small>Today</small></button>
      <button data-view="week" class="nav-item"><span>▦</span><small>Week</small></button>
      <button data-view="progress" class="nav-item"><span>↗</span><small>Progress</small></button>
      <button data-view="settings" class="nav-item"><span>⚙</span><small>Settings</small></button>
    </nav>
  </div>

  <dialog id="workoutDialog" class="sheet"></dialog>
  <input id="importInput" type="file" accept="application/json" hidden>
  <script src="app.js" defer></script>
  <script src="exercise-mode.js" defer></script>
  <script src="training-overrides.js" defer></script>
  <script src="workout-preview.js" defer></script>
</body>
</html>
